<!DOCTYPE html><html lang=en><head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name=theme-color content="#0a0a0c">
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=mobile-web-app-capable content=yes>
<link rel=manifest href=manifest.webmanifest>
<link rel=icon href=icons/icon.svg>
<link rel=apple-touch-icon href=icons/icon.svg>
<title>RD Visuals</title>
</head>
<body style="margin:0;background:#0a0a0c;color:#888;font:14px system-ui;display:flex;align-items:center;justify-content:center;height:100dvh">Loading RD Visuals…</body>
<script>
(async()=>{
  try{
    const parts=await Promise.all([1,2,3,4].map(i=>fetch('p'+i+'.txt').then(r=>r.text())));
    document.open(); document.write(parts.join('')); document.close();
  }catch(e){ document.body.textContent='Load failed: '+e; }
})();
</script>
</html>
